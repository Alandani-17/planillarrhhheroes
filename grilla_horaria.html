<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grilla semanal de carga horaria</title>
  <style>
    :root{
      --bg:#f4f6f9;
      --card:#ffffff;
      --border:#dfe3e8;
      --text:#1f2937;
      --muted:#6b7280;
      --selected:#198754;
      --selected-hover:#157347;
      --header:#243447;
      --danger:#dc3545;
      --warning:#f0ad4e;
      --track:#e9ecef;
      --btn:#eef1f4;
      --btn-text:#27313d;
      --btn-hover:#e1e6eb;
      --hour-bg:#f8fafc;
      --slot:#ffffff;
      --flash:#f8d7da;
      --divider:#aeb7c1;
      --shadow:var(--shadow);
      color-scheme:light;
    }

    :root[data-theme="dark"]{
      --bg:#0f141a;
      --card:#1a222c;
      --border:#2c3642;
      --text:#e5e9ee;
      --muted:#9aa5b1;
      --header:#0b1016;
      --track:#2c3642;
      --btn:#2a3440;
      --btn-text:#e5e9ee;
      --btn-hover:#36424f;
      --hour-bg:#151c24;
      --slot:#1a222c;
      --flash:#5c2229;
      --divider:#4a5663;
      --shadow:rgba(0,0,0,.3);
      color-scheme:dark;
    }

    .toolbar-actions{ display:flex; gap:8px; }

    * { box-sizing: border-box; }

    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .container{
      max-width:1600px;
      margin:0 auto;
      padding:24px;
    }

    h1{
      margin:0 0 6px;
      font-size:1.55rem;
    }

    .subtitle{
      color:var(--muted);
      margin-bottom:18px;
    }

    .summary{
      display:grid;
      grid-template-columns:repeat(3,minmax(220px,1fr));
      gap:12px;
      margin-bottom:16px;
    }

    .person-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:12px;
      padding:14px 16px;
      box-shadow:0 2px 8px var(--shadow);
    }

    .person-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:10px;
    }

    .person-name{
      font-weight:700;
      font-size:1.05rem;
    }

    .counter{
      font-weight:800;
      font-variant-numeric:tabular-nums;
    }

    .progress{
      height:10px;
      background:var(--track);
      border-radius:999px;
      overflow:hidden;
    }

    /* Color por persona */
    [data-person="daniel"],  [data-summary="daniel"]  { --pc:#198754; --pc-hover:#146c43; --pc-soft:rgba(25,135,84,.35); }
    [data-person="liliana"], [data-summary="liliana"] { --pc:#0d6efd; --pc-hover:#0a58ca; --pc-soft:rgba(13,110,253,.35); }
    [data-person="daniela"], [data-summary="daniela"] { --pc:#6f42c1; --pc-hover:#59359a; --pc-soft:rgba(111,66,193,.35); }

:root[data-theme="dark"] [data-person="daniela"], :root[data-theme="dark"] [data-summary="daniela"] { --pc:#8b5cf6; --pc-hover:#7c4ddb; }

    .person-card{ border-left:6px solid var(--pc); }

    .person-name::before{
      content:'';
      display:inline-block;
      width:12px; height:12px;
      border-radius:3px;
      background:var(--pc);
      margin-right:8px;
      vertical-align:-1px;
    }

    thead th[data-person]{ box-shadow:inset 0 -4px 0 var(--pc); }

    .progress > div{
      height:100%;
      width:0;
      background:var(--pc, var(--selected));
      transition:width .15s ease;
    }

    .person-card.limit-reached .progress > div{
      background:var(--warning);
    }

    .person-card.over-limit .progress > div{
      background:var(--danger);
    }

    .toolbar{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px 12px;
      margin-bottom:12px;
    }

    .hint{
      color:var(--muted);
      font-size:.92rem;
    }

    button{
      border:0;
      border-radius:8px;
      padding:8px 12px;
      cursor:pointer;
      font-weight:650;
    }

    .btn-reset{
      background:var(--btn);
      color:var(--btn-text);
    }

    .btn-reset:hover{
      background:var(--btn-hover);
    }

    .table-wrap{
      overflow:auto;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:12px;
      box-shadow:0 2px 8px var(--shadow);
    }

    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      min-width:1350px;
      table-layout:fixed;
      user-select:none;
    }

    th, td{
      border-right:1px solid var(--border);
      border-bottom:1px solid var(--border);
      text-align:center;
      padding:0;
    }

    thead th{
      background:var(--header);
      color:white;
      font-weight:700;
      position:sticky;
      top:0;
      z-index:3;
    }

    thead tr:first-child th{
      height:42px;
      font-size:.95rem;
    }

    thead tr:nth-child(2) th{
      height:38px;
      font-size:.82rem;
      top:42px;
      z-index:4;
    }

    th.hour-col{
      width:72px;
      min-width:72px;
      left:0;
      z-index:6 !important;
    }

    tbody th{
      background:var(--hour-bg);
      width:72px;
      min-width:72px;
      height:42px;
      position:sticky;
      left:0;
      z-index:2;
      font-weight:700;
      font-variant-numeric:tabular-nums;
    }

    td.slot{
      height:42px;
      cursor:crosshair;
      background:var(--slot);
      transition:background .08s ease, box-shadow .08s ease;
    }

    td.slot:hover{
      box-shadow:inset 0 0 0 2px var(--pc-soft);
    }

    td.slot.selected{
      background:var(--pc);
    }

    td.slot.selected:hover{
      background:var(--pc-hover);
    }

    td.slot.limit-blocked{
      animation:flash .25s ease 2;
    }

    @keyframes flash{
      50%{ background:var(--flash); }
    }

    .day-divider{
      border-right:3px solid var(--divider) !important;
    }

    .status-line{
      margin-top:12px;
      font-size:.9rem;
      color:var(--muted);
      min-height:22px;
    }

    @media(max-width:900px){
      .summary{
        grid-template-columns:1fr;
      }
      .container{
        padding:12px;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Grilla semanal de carga horaria</h1>
  <div class="subtitle">
    Cada casillero representa 1 hora. Podés hacer clic o mantener presionado el mouse y arrastrar para seleccionar o deseleccionar.
  </div>

  <section class="summary" id="summary"></section>

  <div class="toolbar">
    <div class="hint">
      Consejo: si comenzás a arrastrar sobre un casillero vacío, selecciona; si comenzás sobre uno marcado, deselecciona.
    </div>
    <div class="toolbar-actions">
      <button type="button" class="btn-reset" id="themeToggle">Modo claro</button>
      <button type="button" class="btn-reset" id="resetAll">Limpiar toda la grilla</button>
    </div>
  </div>

  <div class="table-wrap">
    <table id="schedule">
      <thead>
        <tr id="daysRow">
          <th class="hour-col">Días</th>
        </tr>
        <tr id="peopleRow">
          <th class="hour-col">Horas</th>
        </tr>
      </thead>
      <tbody id="gridBody"></tbody>
    </table>
  </div>

  <div class="status-line" id="status"></div>
</div>

<script>
(() => {
  const people = [
    { id: 'daniel',  name: 'Daniel',  limit: 40 },
    { id: 'liliana', name: 'Liliana', limit: 30 },
    { id: 'daniela', name: 'Daniela', limit: 30 }
  ];

  const days = [
    'Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'
  ];

  // Horas 7:00 a 20:00 inclusive. Cada celda equivale a 1 hora.
  const hours = Array.from({ length: 14 }, (_, i) => i + 7);

  const STORAGE_KEY = 'grilla_horaria_semanal_v1';

  const daysRow = document.getElementById('daysRow');
  const peopleRow = document.getElementById('peopleRow');
  const gridBody = document.getElementById('gridBody');
  const summary = document.getElementById('summary');
  const status = document.getElementById('status');

  let isDragging = false;
  let dragMode = 'select'; // select | deselect
  let lastCellKey = null;

  function cellKey(dayIndex, personId, hour) {
    return `${dayIndex}|${personId}|${hour}`;
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? new Set(JSON.parse(raw)) : new Set();
    } catch {
      return new Set();
    }
  }

  let selected = loadState();

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...selected])); } catch {}
  }

  function countFor(personId) {
    let total = 0;
    selected.forEach(key => {
      if (key.split('|')[1] === personId) total++;
    });
    return total;
  }

  function showStatus(message) {
    status.textContent = message;
    clearTimeout(showStatus.timer);
    showStatus.timer = setTimeout(() => status.textContent = '', 2600);
  }

  function updateSummary() {
    people.forEach(person => {
      const used = countFor(person.id);
      const card = document.querySelector(`[data-summary="${person.id}"]`);
      const counter = card.querySelector('.counter');
      const bar = card.querySelector('.progress > div');

      counter.textContent = `${used} / ${person.limit} h`;
      bar.style.width = `${Math.min(100, used / person.limit * 100)}%`;

      card.classList.toggle('limit-reached', used === person.limit);
      card.classList.toggle('over-limit', used > person.limit);
    });
  }

  function setCell(cell, shouldSelect) {
    const key = cell.dataset.key;
    const personId = cell.dataset.person;
    const person = people.find(p => p.id === personId);

    if (shouldSelect) {
      if (selected.has(key)) return;

      if (countFor(personId) >= person.limit) {
        cell.classList.add('limit-blocked');
        setTimeout(() => cell.classList.remove('limit-blocked'), 600);
        showStatus(`${person.name} ya alcanzó su límite de ${person.limit} horas.`);
        return;
      }

      selected.add(key);
      cell.classList.add('selected');
    } else {
      selected.delete(key);
      cell.classList.remove('selected');
    }

    saveState();
    updateSummary();
  }

  function buildSummary() {
    summary.innerHTML = people.map(person => `
      <article class="person-card" data-summary="${person.id}">
        <div class="person-head">
          <div class="person-name">${person.name}</div>
          <div class="counter">0 / ${person.limit} h</div>
        </div>
        <div class="progress"><div></div></div>
      </article>
    `).join('');
  }

  function buildHeader() {
    days.forEach((day, dayIndex) => {
      const th = document.createElement('th');
      th.colSpan = people.length;
      th.textContent = day;
      if (dayIndex < days.length - 1) th.classList.add('day-divider');
      daysRow.appendChild(th);

      people.forEach((person, personIndex) => {
        const pth = document.createElement('th');
        pth.textContent = person.name;
        pth.dataset.person = person.id;
        if (personIndex === people.length - 1 && dayIndex < days.length - 1) {
          pth.classList.add('day-divider');
        }
        peopleRow.appendChild(pth);
      });
    });
  }

  function buildGrid() {
    hours.forEach(hour => {
      const tr = document.createElement('tr');

      const hourTh = document.createElement('th');
      hourTh.textContent = hour;
      tr.appendChild(hourTh);

      days.forEach((_, dayIndex) => {
        people.forEach((person, personIndex) => {
          const td = document.createElement('td');
          const key = cellKey(dayIndex, person.id, hour);

          td.className = 'slot';
          td.dataset.key = key;
          td.dataset.person = person.id;
          td.dataset.day = dayIndex;
          td.dataset.hour = hour;
          td.title = `${days[dayIndex]} ${hour}:00 - ${person.name}`;

          if (selected.has(key)) td.classList.add('selected');
          if (personIndex === people.length - 1 && dayIndex < days.length - 1) {
            td.classList.add('day-divider');
          }

          tr.appendChild(td);
        });
      });

      gridBody.appendChild(tr);
    });
  }

  function cellFromTarget(target) {
    return target.closest && target.closest('td.slot');
  }

  document.addEventListener('mousedown', e => {
    const cell = cellFromTarget(e.target);
    if (!cell || e.button !== 0) return;

    e.preventDefault();
    isDragging = true;
    lastCellKey = cell.dataset.key;
    dragMode = cell.classList.contains('selected') ? 'deselect' : 'select';

    setCell(cell, dragMode === 'select');
  });

  document.addEventListener('mouseover', e => {
    if (!isDragging) return;

    const cell = cellFromTarget(e.target);
    if (!cell) return;
    if (cell.dataset.key === lastCellKey) return;

    lastCellKey = cell.dataset.key;
    setCell(cell, dragMode === 'select');
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
    lastCellKey = null;
  });

  // Evita que el arrastre seleccione texto o elementos accidentalmente.
  document.addEventListener('dragstart', e => e.preventDefault());

  document.getElementById('resetAll').addEventListener('click', () => {
    if (!confirm('¿Querés limpiar toda la grilla?')) return;

    selected.clear();
    saveState();
    document.querySelectorAll('td.slot.selected').forEach(td => {
      td.classList.remove('selected');
    });
    updateSummary();
    showStatus('Grilla limpiada.');
  });

  // Tema claro / oscuro (arranca en oscuro y recuerda la elección)
  const THEME_KEY = 'grilla_horaria_tema';
  const themeBtn = document.getElementById('themeToggle');
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    themeBtn.textContent = t === 'dark' ? '☀ Modo claro' : '☾ Modo oscuro';
  }
  let theme = 'dark';
  try { theme = localStorage.getItem(THEME_KEY) || 'dark'; } catch {}
  applyTheme(theme);
  themeBtn.addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    applyTheme(theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch {}
  });

  buildSummary();
  buildHeader();
  buildGrid();
  updateSummary();
})();
</script>
</body>
</html>
